# `docker compose up --build` runs the service the way it deploys: the
# same image, configured only through the environment, three replicas
# behind Caddy on :8080.
# pgAdmin is opt-in: `docker compose --profile tools up`.

services:
  # Three replicas of one image behind Caddy, as deployed. Each keeps its
  # own seat map, kept in step through Postgres LISTEN/NOTIFY, and adds its
  # peers' counters into /metrics. Pool and permits are per replica, sized
  # so the three together load Postgres about as much as one did.
  api-1: &api
    build: .
    image: seat-reservation-api
    container_name: seat-reservation-api-1
    restart: unless-stopped
    environment: &api-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/seats
      CACHE_URL: redis://dragonfly:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # Mints test tokens for the burst tool; never enable with a real secret.
      AUTH_TOKEN_ROUTE_ENABLED: "true"
      PORT: "8080"
      DB_POOL_MAX_CONNECTIONS: "14"
      RESERVE_SEMAPHORE_PERMITS: "10"
      # Fail /readyz this long on SIGTERM before closing, so Caddy's health
      # check (every 2s) moves traffic away first.
      SHUTDOWN_DRAIN_SECS: "4"
      REPLICA_ID: api-1
      PEERS: http://api-2:8080,http://api-3:8080
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started

  api-2:
    <<: *api
    container_name: seat-reservation-api-2
    environment:
      <<: *api-env
      REPLICA_ID: api-2
      PEERS: http://api-1:8080,http://api-3:8080

  api-3:
    <<: *api
    container_name: seat-reservation-api-3
    environment:
      <<: *api-env
      REPLICA_ID: api-3
      PEERS: http://api-1:8080,http://api-2:8080

  lb:
    image: caddy:2
    container_name: seat-reservation-lb
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SITE: ":8080"
      UPSTREAMS: api-1:8080 api-2:8080 api-3:8080
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      api-3:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: seat-reservation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seats"]
      interval: 5s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: seat-reservation-dragonfly
    restart: unless-stopped
    # Dragonfly needs 256mb per thread; it defaults to one thread per core.
    command: ["--proactor_threads=2", "--maxmemory=512mb", "--cache_mode=true"]
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:latest
    container_name: seat-reservation-pgadmin
    restart: unless-stopped
    # Login comes from the environment (or the git-ignored .env next to this
    # file); the defaults are only for a throwaway local pgAdmin.
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
