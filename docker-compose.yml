# `docker compose up --build` runs the service the way it deploys: the
# same image, configured only through the environment.
# pgAdmin is opt-in: `docker compose --profile tools up`.

services:
  api:
    build: .
    image: seat-reservation-api
    container_name: seat-reservation-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/seats
      CACHE_URL: redis://dragonfly:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # Mints test tokens for the burst tool; never enable with a real secret.
      AUTH_TOKEN_ROUTE_ENABLED: "true"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: seat-reservation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seats"]
      interval: 5s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: seat-reservation-dragonfly
    restart: unless-stopped
    # Dragonfly needs 256mb per thread; it defaults to one thread per core.
    command: ["--proactor_threads=2", "--maxmemory=512mb", "--cache_mode=true"]
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:latest
    container_name: seat-reservation-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
